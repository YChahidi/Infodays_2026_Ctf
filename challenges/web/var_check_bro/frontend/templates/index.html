<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VAR Check Bro — Infodays 2026</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0b3d2e; color: #f5f5f5; max-width: 720px; margin: 40px auto; padding: 20px; }
        h1 { color: #ffd700; letter-spacing: 1px; }
        .card { background: #0f5132; border: 2px solid #ffd700; border-radius: 8px; padding: 24px; }
        input[type=text] { width: 100%; padding: 10px; font-size: 14px; border-radius: 4px; border: none; }
        button { margin-top: 12px; background: #ffd700; color: #000; border: 0; padding: 10px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .small { font-size: 12px; color: #c9c9c9; }
        code { background: #052e1f; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>VAR Check Bro</h1>
    <p>Official Infodays 2026 Video Assistant Referee review portal.<br>
       Drop in a highlight URL and our referees will fetch it for analysis.</p>
    <div class="card">
        <form action="/review" method="post">
            <label for="video_url">Highlight URL</label><br>
            <input type="text" id="video_url" name="video_url" placeholder="https://highlights.example.com/goal.mp4" required>
            <br>
            <button type="submit">Request VAR review</button>
        </form>
        <p class="small">VAR team has strict rules: no private hosts, no funny business. Only external highlights.</p>
    </div>
    <p class="small">v1.0 — powered by <code>var-internal</code></p>
</body>
</html>
