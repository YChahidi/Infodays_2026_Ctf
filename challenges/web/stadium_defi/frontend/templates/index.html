<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stadium DeFi &#x1F3DF; Infodays 2026</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #050a12;
    --surface: #0a1628;
    --border: #152040;
    --border-hi: #1e3a6e;
    --blue: #2d7af6;
    --blue-bright: #5e9fff;
    --white: #f0f4fa;
    --muted: #8899b5;
    --code-bg: #060d1a;
    --red: #e53935;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
  }

  /* ── fullscreen gif splash ─────────────── */
  .splash {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .splash img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .splash-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(5,10,18,0.3) 0%,
      rgba(5,10,18,0.1) 40%,
      rgba(5,10,18,0.6) 85%,
      rgba(5,10,18,0.95) 100%);
    pointer-events: none;
  }
  .splash-title {
    position: absolute;
    bottom: 80px;
    left: 0; right: 0;
    text-align: center;
    z-index: 2;
  }
  .splash-title h1 {
    font-size: 48px; font-weight: 800;
    color: var(--white);
    text-shadow: 0 2px 40px rgba(0,0,0,0.8);
  }
  .splash-title h1 span { color: var(--blue-bright); }
  .splash-title .sub {
    font-size: 14px; color: var(--muted);
    margin-top: 8px; letter-spacing: 2px; text-transform: uppercase;
  }
  .scroll-hint {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    animation: pulse 2s ease-in-out infinite;
  }
  .scroll-hint .arrow {
    display: block; font-size: 20px; margin-top: 4px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  @media (max-width: 800px) {
    .splash-title h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="splash">
  <img src="/static/defi.gif" alt="">
  <div class="splash-overlay"></div>
  <div class="splash-title">
    <h1>&#x1F3DF; <span>Stadium</span> DeFi</h1>
    <div class="sub">&#x26D3; Web3 CTF &middot; Infodays 2026</div>
  </div>
  <div class="scroll-hint">
    Scroll down
    <span class="arrow">&#x2193;</span>
  </div>
</div>

</body>
</html>
