<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ name }} &#x1F4C4; Source</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #050a12;
    --surface: #0a1628;
    --border: #152040;
    --border-hi: #1e3a6e;
    --blue: #2d7af6;
    --blue-bright: #5e9fff;
    --white: #f0f4fa;
    --muted: #6b7fa0;
    --code-bg: #060d1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      linear-gradient(rgba(45,122,246,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,122,246,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .container {
    max-width: 1040px; margin: 0 auto;
    padding: 32px 24px 80px; position: relative; z-index: 1;
  }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .top-bar h1 {
    font-size: 18px; font-weight: 600; color: var(--blue-bright);
    letter-spacing: -0.3px;
  }
  .top-bar a {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none;
    font-size: 13px; font-weight: 500;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: all 0.2s;
  }
  .top-bar a:hover {
    border-color: var(--blue);
    color: var(--blue-bright);
  }

  .code-frame {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .code-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .code-header .dots {
    display: flex; gap: 6px;
  }
  .code-header .dots span {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid var(--border-hi);
    background: var(--surface);
  }
  .code-header .filename {
    font-family: 'JetBrains Mono', monospace;
    color: var(--white); font-weight: 500;
  }

  pre {
    padding: 20px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.65;
    color: var(--white);
    overflow-x: auto;
    tab-size: 4;
  }
</style>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <h1>&#x1F4C4; {{ name }}</h1>
    <a href="/">&#x2190; Back to challenge</a>
  </div>

  <div class="code-frame">
    <div class="code-header">
      <div class="dots"><span></span><span></span><span></span></div>
      <span class="filename">{{ name }}</span>
    </div>
    <pre>{{ code }}</pre>
  </div>

</div>

</body>
</html>
