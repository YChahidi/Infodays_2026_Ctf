<!doctype html>
<html><head><meta charset="utf-8"><title>Login — Yami Sukehiro</title>
<style>
body{background:#0a0a0a;color:#d4c8a0;font-family:Georgia,serif;margin:0}
.card{max-width:420px;margin:80px auto;background:#111;padding:32px;border:1px solid #3a2a2a;border-radius:4px}
h2{color:#c0a060;text-align:center;letter-spacing:3px}
input{width:100%;box-sizing:border-box;background:#1a1a1a;border:1px solid #3a2a2a;color:#d4c8a0;padding:10px;margin:6px 0}
button{width:100%;background:#3a2020;color:#c0a060;border:1px solid #5a3030;padding:12px;cursor:pointer;letter-spacing:2px;margin-top:8px}
a{color:#c0a060}
p#msg{color:#f66;text-align:center;min-height:16px}
</style></head><body>
<div class="card">
  <h2>LOGIN</h2>
  <p id="msg"></p>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="doLogin()">Enter</button>
  <p style="text-align:center">No account? <a href="/register">Register</a></p>
</div>
<script>
async function doLogin(){
  const r = await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
  if(r.ok){location='/dashboard'} else {const j=await r.json();msg.textContent=j.message||'Login failed'}
}
</script></body></html>
