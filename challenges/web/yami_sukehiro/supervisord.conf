[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
user=yami

[program:web]
command=/usr/local/bin/python3 /opt/app/app.py
directory=/opt/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/web.log
stderr_logfile=/var/log/supervisor/web.err
environment=FLAG1="%(ENV_FLAG1)s"

[program:cron]
command=/usr/local/bin/python3 /data/scripts/cron_runner.py
directory=/data/scripts
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron.err
