<!doctype html>
<html><head><meta charset="utf-8"><title>Monitoring — Login</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100vh;background:#0a0a14;color:#ddd;font-family:Helvetica,Arial,sans-serif;margin:0}
.bg-gif{position:fixed;inset:0;width:100%;height:100%;z-index:0;object-fit:cover;opacity:.14;pointer-events:none}
.card{position:relative;z-index:1;max-width:380px;margin:100px auto;background:rgba(20,20,42,.9);padding:28px;border:1px solid #2a2440;border-radius:4px;backdrop-filter:blur(2px)}
h2{color:#8ab4ff;text-align:center;letter-spacing:3px;margin-top:0}
input{width:100%;box-sizing:border-box;background:#0a0a14;border:1px solid #2a2440;color:#ddd;padding:10px;margin:6px 0}
button{width:100%;background:#2a2a4a;color:#8ab4ff;border:1px solid #4a4a6a;padding:12px;cursor:pointer;letter-spacing:2px}
#msg{color:#f66;text-align:center;min-height:16px}
</style></head><body>
<img src="/static/batistuta.webp" class="bg-gif" alt="">
<div class="card">
  <h2>MONITORING</h2>
  <p id="msg"></p>
  <input id="u" placeholder="Username">
  <input id="p" type="password" placeholder="Password">
  <button onclick="doLogin()">Sign in</button>
</div>
<script>
// CLIENT-SIDE ONLY auth. If /api/login returns {success:true}, redirect
// to dashboard. The server always returns {success:false} — attackers
// intercept and flip the response in their proxy, then the dashboard
// loads because it has no server-side auth check either.
async function doLogin(){
  const r = await fetch('/monitoring/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: u.value, password: p.value})
  });
  const j = await r.json();
  if (j.success) { location = '/monitoring/dashboard'; }
  else { msg.textContent = j.reason || 'login failed'; }
}
</script></body></html>
