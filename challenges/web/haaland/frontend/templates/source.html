<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ name }} — source</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{min-height:100vh;background:#0b0b10;color:#e6e6e6;font-family:Menlo,Consolas,monospace}
    .bg-gif{position:fixed;inset:0;width:100%;height:100%;z-index:0;object-fit:cover;opacity:.10;pointer-events:none}
    header{position:relative;z-index:1;padding:12px 20px;background:rgba(27,27,36,.9);border-bottom:1px solid #2e2e3b}
    header a{color:#6ae2ff;text-decoration:none}
    pre{position:relative;z-index:1;background:rgba(19,19,26,.92);padding:20px;margin:0;overflow:auto;font-size:13px;line-height:1.5;min-height:calc(100vh - 46px)}
  </style>
</head>
<body>
  <img src="/static/halland.gif" class="bg-gif" alt="">
  <header><a href="/">← back</a> &middot; {{ name }}</header>
  <pre>{{ code }}</pre>
</body>
</html>
