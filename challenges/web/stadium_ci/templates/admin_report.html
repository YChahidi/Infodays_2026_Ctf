<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VAR Report — {{ report_id }}</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #050f0a; color: #f4f4f4; max-width: 820px; margin: 40px auto; padding: 20px; }
        h1 { color: #ff4444; }
        .card { background: #1a0808; border: 2px solid #ffd700; padding: 22px; border-radius: 6px; }
        .flag { display: block; background: #000; color: #ffd700; padding: 16px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 15px; word-break: break-all; }
        a { color: #ffd700; }
    </style>
</head>
<body>
    <h1>Sealed VAR Report — {{ report_id }}</h1>
    <div class="card">
        <p>The final decision issued by the VAR room for this match has been sealed
           into the report below.</p>
        <p><strong>Sealed flag:</strong></p>
        <code class="flag">{{ flag }}</code>
    </div>
    <p><a href="/admin">&larr; Back to admin console</a></p>
</body>
</html>
