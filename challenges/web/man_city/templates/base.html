<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Man City FC — Internal Portal{% endblock %}</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0c1220;color:#d0d8e8;min-height:100vh}
  .bg-gif{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;object-fit:cover;opacity:.12;pointer-events:none}
  nav,.container,footer{position:relative;z-index:1}
  nav{background:#0a0f1a;border-bottom:1px solid #1a2540;padding:12px 24px;display:flex;align-items:center;gap:20px}
  nav .brand{color:#6cabdd;font-weight:700;font-size:1.1em;letter-spacing:1px;text-transform:uppercase;text-decoration:none}
  nav a{color:#667;text-decoration:none;font-size:.85em;transition:.2s}
  nav a:hover{color:#6cabdd}
  nav .spacer{flex:1}
  .container{max-width:960px;margin:0 auto;padding:30px 20px}
  h1{color:#6cabdd;font-size:1.6em;margin-bottom:16px;font-weight:600}
  h2{color:#8ab4e8;font-size:1.2em;margin-bottom:12px}
  a{color:#6cabdd}
  .card{background:#111827;border:1px solid #1e2a42;border-radius:6px;padding:20px;margin-bottom:16px}
  .btn{display:inline-block;padding:8px 20px;border-radius:4px;border:none;cursor:pointer;font-size:.85em;font-weight:600;text-decoration:none;transition:.2s}
  .btn-primary{background:#6cabdd;color:#0a0f1a}
  .btn-primary:hover{opacity:.85}
  .btn-secondary{background:#1e2a42;color:#8ab4e8;border:1px solid #2a3a5c}
  input[type=text],input[type=password],select{padding:8px 12px;border-radius:4px;border:1px solid #1e2a42;background:#0a0f1a;color:#d0d8e8;font-size:.9em;width:100%}
  input:focus,select:focus{outline:none;border-color:#6cabdd44}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:8px 10px;border-bottom:1px solid #1e2a42;color:#556;font-size:.78em;text-transform:uppercase;letter-spacing:.5px}
  td{padding:8px 10px;border-bottom:1px solid #111827;font-size:.9em}
  .mono{font-family:'Courier New',monospace}
  footer{text-align:center;color:#334;font-size:.72em;padding:30px 0;letter-spacing:.5px}
</style>
</head>
<body>
<img src="/static/kdb.gif" class="bg-gif" alt="">
<nav>
  <a href="/" class="brand">Man City FC</a>
  <a href="/players">Players</a>
  <a href="/search">Search</a>
  <a href="/player/bio">Bio Editor</a>
  <a href="/reports">Reports</a>
  <a href="/preferences">Settings</a>
  <a href="/api/docs">API</a>
  <span class="spacer"></span>
  {% if session.get('user') %}
  <span style="color:#556;font-size:.8em">{{ session['user'] }}</span>
  <a href="/logout">Logout</a>
  {% else %}
  <a href="/login">Login</a>
  {% endif %}
</nav>
{% block content %}{% endblock %}
<footer>MAN CITY FC INTERNAL PORTAL &mdash; INFODAYS 2026</footer>
</body>
</html>
