# Template — replace referee-briefing, Misc, 4444, NODE4444, IMAGE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: referee-briefing
  namespace: ctfd
  labels:
    app: referee-briefing
    category: Misc
spec:
  replicas: 0
  selector:
    matchLabels:
      app: referee-briefing
  template:
    metadata:
      labels:
        app: referee-briefing
        category: Misc
    spec:
      containers:
      - name: referee-briefing
        image: registry.digitalocean.com/infodays-registry/referee-briefing:latest
        ports:
        - containerPort: 4444
        env:
        - name: FLAG
          valueFrom:
            secretKeyRef:
              name: flags-TEAM_ID
              key: referee-briefing
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: referee-briefing
  namespace: ctfd
spec:
  type: NodePort
  selector:
    app: referee-briefing
  ports:
  - port: 4444
    targetPort: 4444
    nodePort: NODE4444
