# Template — replace var-check-bro, Web, 8080, NODE8080, IMAGE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: var-check-bro
  namespace: ctfd
  labels:
    app: var-check-bro
    category: Web
spec:
  replicas: 0
  selector:
    matchLabels:
      app: var-check-bro
  template:
    metadata:
      labels:
        app: var-check-bro
        category: Web
    spec:
      containers:
      - name: var-check-bro
        image: registry.digitalocean.com/infodays-registry/var-check-bro:latest
        ports:
        - containerPort: 8080
        env:
        - name: FLAG
          valueFrom:
            secretKeyRef:
              name: flags-TEAM_ID
              key: var-check-bro
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: var-check-bro
  namespace: ctfd
spec:
  type: NodePort
  selector:
    app: var-check-bro
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: NODE8080
