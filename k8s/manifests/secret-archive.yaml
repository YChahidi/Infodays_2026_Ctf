# Template — replace secret-archive, Web, 8080, NODE8080, IMAGE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-archive
  namespace: ctfd
  labels:
    app: secret-archive
    category: Web
spec:
  replicas: 0
  selector:
    matchLabels:
      app: secret-archive
  template:
    metadata:
      labels:
        app: secret-archive
        category: Web
    spec:
      containers:
      - name: secret-archive
        image: registry.digitalocean.com/infodays-registry/secret-archive:latest
        ports:
        - containerPort: 8080
        env:
        - name: FLAG
          valueFrom:
            secretKeyRef:
              name: flags-TEAM_ID
              key: secret-archive
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: secret-archive
  namespace: ctfd
spec:
  type: NodePort
  selector:
    app: secret-archive
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: NODE8080
